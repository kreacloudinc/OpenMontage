name: immagine agente di regia OMAI Studio

# Costruisce l'immagine usata da studio.omai.cloud. Non tocca il resto del repository:
# parte solo quando cambia l'integrazione o qualcosa che finisce dentro l'immagine.
on:
  push:
    branches: [main]
    paths:
      - "deploy/omai-studio/**"
      - "requirements.txt"
      - "remotion-composer/package*.json"
      - ".github/workflows/omai-studio-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: omai-studio-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla che il gateway sia sintatticamente valido
        run: python -m py_compile deploy/omai-studio/gateway.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/openmontage-gateway
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/omai-studio/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=omai-gateway
          cache-to: type=gha,mode=max,scope=omai-gateway
